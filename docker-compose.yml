name: myminicloud

services:
  web-frontend-server:
    build:
      context: ./web-frontend-server
    image: myminicloud-web:dev
    container_name: web-frontend-server
    ports:
      - "8080:80"
    networks:
      cloud-net:
        ipv4_address: 172.19.0.6
    restart: unless-stopped

  web-frontend-server1:
    build:
      context: ./web-frontend-server1
    image: myminicloud-web1:dev
    container_name: web-frontend-server1
    networks:
      cloud-net:
        ipv4_address: 172.19.0.8
    restart: unless-stopped

  web-frontend-server2:
    build:
      context: ./web-frontend-server2
    image: myminicloud-web2:dev
    container_name: web-frontend-server2
    networks:
      cloud-net:
        ipv4_address: 172.19.0.9
    restart: unless-stopped

  application-backend-server:
    build:
      context: ./application-backend-server
    image: myminicloud-app:dev
    container_name: application-backend-server
    ports:
      - "8085:8081"
    environment:
      OIDC_ISSUER: ${OIDC_ISSUER:-http://auth.cloud.local:8081/realms/realm_52400114}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-flask-app}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://authentication-identity-server:8080/realms/realm_52400114/protocol/openid-connect/certs}
    networks:
      cloud-net:
        ipv4_address: 172.19.0.4
    restart: unless-stopped

  relational-database-server:
    image: mariadb:11
    container_name: relational-database-server
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: minicloud
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./relational-database-server/init:/docker-entrypoint-initdb.d:ro
    networks:
      cloud-net:
        ipv4_address: 172.19.0.7
    restart: unless-stopped

  authentication-identity-server:
    image: quay.io/keycloak/keycloak:26.4
    container_name: authentication-identity-server
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./authentication-identity-server/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks:
      cloud-net:
        ipv4_address: 172.19.0.2
    restart: unless-stopped

  object-storage-server:
    image: cgr.dev/chainguard/minio:latest
    container_name: object-storage-server
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      cloud-net:
        ipv4_address: 172.19.0.3
    restart: unless-stopped

  minio-init:
    image: python:3.12-slim
    container_name: minio-init
    depends_on:
      - object-storage-server
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_ENDPOINT: http://object-storage-server:9000
      MINIO_BUCKET_NAME: demo
    volumes:
      - ./object-storage-server/init_buckets.py:/app/init_buckets.py:ro
    working_dir: /app
    command:
      - sh
      - -c
      - "pip install --no-cache-dir boto3 && python init_buckets.py"
    networks:
      - cloud-net
    restart: "no"

  internal-dns-server:
    image: internetsystemsconsortium/bind9:9.18
    container_name: internal-dns-server
    ports:
      - "1053:53/udp"
      - "1053:53/tcp"
    volumes:
      - ./internal-dns-server/named.conf:/etc/bind/named.conf:ro
      - ./internal-dns-server/named.conf.options:/etc/bind/named.conf.options:ro
      - ./internal-dns-server/named.conf.local:/etc/bind/named.conf.local:ro
      - ./internal-dns-server/db.cloud.local:/etc/bind/db.cloud.local:ro
    networks:
      cloud-net:
        ipv4_address: 172.19.0.5
    restart: unless-stopped

  monitoring-node-exporter-server:
    image: prom/node-exporter:latest
    container_name: monitoring-node-exporter-server
    ports:
      - "9100:9100"
    networks:
      cloud-net:
        ipv4_address: 172.19.0.10
    restart: unless-stopped

  monitoring-prometheus-server:
    image: prom/prometheus:latest
    container_name: monitoring-prometheus-server
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring-prometheus-server/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - monitoring-node-exporter-server
      - web-frontend-server
      - web-frontend-server1
      - web-frontend-server2
    networks:
      cloud-net:
        ipv4_address: 172.19.0.11
    restart: unless-stopped

  monitoring-grafana-dashboard-server:
    image: grafana/grafana:latest
    container_name: monitoring-grafana-dashboard-server
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring-grafana-dashboard-server/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - monitoring-prometheus-server
    networks:
      cloud-net:
        ipv4_address: 172.19.0.12
    restart: unless-stopped

  api-gateway-proxy-server:
    image: nginx:stable
    container_name: api-gateway-proxy-server
    ports:
      - "80:80"
    volumes:
      - ./api-gateway-proxy-server/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web-frontend-server
      - web-frontend-server1
      - web-frontend-server2
      - application-backend-server
      - authentication-identity-server
    networks:
      cloud-net:
        ipv4_address: 172.19.0.13
    restart: unless-stopped

networks:
  cloud-net:
    name: cloud-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/16

volumes:
  db_data:
  keycloak_data:
  minio_data:
